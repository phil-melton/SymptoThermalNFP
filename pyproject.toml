[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symptothermal-nfp"
version = "0.1.0"
description = "Local-first sympto-thermal fertility tracking foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8.0",
    "flask>=3.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
symptothermal = "symptothermal_nfp.cli:main"
symptothermal-web = "symptothermal_nfp.web.app:main"

[tool.setuptools.package-data]
symptothermal_nfp = ["web/templates/*.html"]

[tool.setuptools]
package-dir = {"" = "packages/domain"}

[tool.setuptools.packages.find]
where = ["packages/domain"]

[tool.pytest.ini_options]
pythonpath = ["packages/domain"]
testpaths = ["tests"]
